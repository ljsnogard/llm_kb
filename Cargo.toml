[workspace]
resolver = "3"
members = [
    "kb_svc/crates/abs_kb_svc",
    "kb_svc/crates/abs_llm",
    "kb_svc/crates/kb_core",
    "kb_svc/crates/kb_svc_salvo",

    "kb_plugins/crates/kb_rig_llm_v1_adapt",
    "kb_plugins/crates/kb_rig_llm_v1_agent",
]

[workspace.package]
edition = "2024"
authors = ["lino <lino_snsalias@outlook.com>"]

# 这里只保留「多个成员共用」的依赖。
# 只为单个 crate 服务的依赖写在各自的 Cargo.toml 里（例如 salvo 只属于 kb_svc_salvo）。
#
# 每个依赖都用**标准表**（`[workspace.dependencies.<名字>]`）而不是内联表（`{ ... }`）
# 描述：字段各占一行，增删字段、加注释、调整顺序时的 diff 都更清楚。
# 需要给某个依赖加注释时也写在它自己的表里，不必挤在同一行。
[workspace.dependencies]

# ── 知识库自身的抽象层与基础设施 ──────────────────────────────────────
[workspace.dependencies.abs_async_iter]
git = "https://gitee.com/lino_snsalias/abs_async_iter.git"

[workspace.dependencies.abs_art-bridge]
version = "0.2.2"

[workspace.dependencies.abs_cancel]
git = "https://gitee.com/lino_snsalias/abs_cancel-rs.git"
branch = "dev/0.2.0"

[workspace.dependencies.abs_str]
git = "https://gitee.com/lino_snsalias/abs_str-rs.git"

[workspace.dependencies.anylr]
git = "https://gitee.com/lino_snsalias/anylr.rs.git"
branch = "dev/0.2.0"

[workspace.dependencies.buffex]
git = "https://gitee.com/lino_snsalias/buffex.git"
branch = "dev/0.3.0"

[workspace.dependencies.mm_ptr]
git = "https://gitee.com/lino_snsalias/mm_ptr.git"
branch = "dev/0.1.3"

# ── 通用工具：至少两个成员在用 ────────────────────────────────────────
[workspace.dependencies.funty]
version = "3.0.0-rc2"
default-features = false

[workspace.dependencies.pin-project]
version = "1.1.*"

[workspace.dependencies.pin-utils]
version = "*"

[workspace.dependencies.log]
version = "0.4.*"

[workspace.dependencies.futures-lite]
version = "2"

[workspace.dependencies.compio]
version = "0.19.*"
features = ["fs", "macros", "time"]

[workspace.dependencies.thiserror]
version = "2.0"
default-features = false

# ── 服务端运行时：kb_svc_salvo 与 kb_core 都在用 ──────────────────────
[workspace.dependencies.tokio]
version = "1.*"
features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
]

# ── lint 配置 ────────────────────────────────────────────────────────
#
# **暂时**把这些「未使用」告警压掉，等依赖关系收敛后再删除本段并逐个清理。
# 它们不影响正确性，但会让 `cargo check` 不再零告警（AGENTS.md 第 6 条），
# 从而淹没真正需要关注的告警。
#
# - `unused_workspace_dependencies`：`[workspace.dependencies]` 里声明了、
#   但当前没有任何成员 `workspace = true` 引用它的条目。列在这里是因为
#   它们是后续要用的（例如 abs_art-bridge / compio / thiserror）。
# - `unused_workspace_package_fields`：`[workspace.package]` 里的字段
#   目前没有任何成员用 `*.workspace = true` 继承（`edition` / `authors`）。
#
# - `unused_dependencies`：某个成员声明了却没用到的依赖（目前只有 `abs_kb_svc`
#   的 `buffex`，它是为后续 IPC 缓冲区工作预留的）。
#
# ⚠️ 这条只能放在这里：cargo 不允许成员同时写 `lints.workspace = true` 和本地
# `[lints.*]` 覆盖（报 "cannot override `workspace.lints` in `lints`"），
# 所以它一放开就是整个 workspace 都放开。收窄的做法是等依赖真正用上之后
# 删掉本行，而不是挪进某个成员。
[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
unused_workspace_package_fields = "allow"
unused_dependencies = "allow"
