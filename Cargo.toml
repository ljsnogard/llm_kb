[workspace]
resolver = "3"
# 分组成员，与 README「各 crate 的分工」一节对应。
members = [
    # 服务端：主进程 / 协议 / 传输实现 / LLM 语义
    #
    # 协议按「版本 + 对端」拆成独立 crate；`abs_kb_svc` 只是**聚合层**，
    # 让调用方继续写 `abs_kb_svc::v1::desktop::X` 而不必跟着拆分改路径。
    "kb_svc/crates/abs_kb_core_handshake",
    "kb_svc/crates/abs_kb_svc",
    "kb_svc/crates/abs_kb_svc_v1_desktop",
    "kb_svc/crates/abs_llm",
    "kb_svc/crates/kb_core",

    # 客户端侧基础设施（与 kb_clients/ 下的应用分开成 crates）
    "kb_clients/crates/kb_client_config",
    "kb_clients/crates/kb_client_conn_mgr",

    # 插件与配套进程
    "kb_plugins/crates/kb_core_rproxy",
    # rproxy 的 TCP 帧格式：网关与远程客户端共用（原来只长在网关的 bin 里）。
    "kb_plugins/crates/kb_core_rproxy_wire",
    # 启动 `kb_core` 子进程并等它公布 IPC 端点文件名。rproxy 与桌面客户端的
    # Rust 侧共用；它是"配套进程"这一类，因此和 rproxy 放在一起。
    "kb_plugins/crates/kb_core_starter",
    # 协议的本机传输实现：`kb_core` 是它的服务端，客户端是它的代理。
    "kb_plugins/crates/kb_svc_servo_ipc",
    "kb_plugins/crates/kb_rig_llm_v1_adapt",
    "kb_plugins/crates/kb_rig_llm_v1_agent",
]

# 这里只保留「多个成员共用」的依赖。
# 只为单个 crate 服务的依赖写在各自的 Cargo.toml 里（例如 salvo 只属于 kb_svc_salvo）。
#
# 每个依赖都用**标准表**（`[workspace.dependencies.<名字>]`）而不是内联表（`{ ... }`）
# 描述：字段各占一行，增删字段、加注释、调整顺序时的 diff 都更清楚。
# 需要给某个依赖加注释时也写在它自己的表里，不必挤在同一行。
[workspace.dependencies]

# ── 知识库自身的抽象层与基础设施 ──────────────────────────────────────
[workspace.dependencies.abs_async_iter]
git = "https://gitee.com/lino_snsalias/abs_async_iter.git"

# [workspace.dependencies.abs_art-bridge]
# version = "0.2.2"

[workspace.dependencies.abs_buff]
git = "https://gitee.com/lino_snsalias/abs_buff.git"
branch = "dev/0.3.0"

[workspace.dependencies.abs_cancel]
git = "https://gitee.com/lino_snsalias/abs_cancel-rs.git"
branch = "dev/0.2.0"

[workspace.dependencies.abs_str]
git = "https://gitee.com/lino_snsalias/abs_str-rs.git"

[workspace.dependencies.anylr]
git = "https://gitee.com/lino_snsalias/anylr.rs.git"
branch = "dev/0.2.0"

[workspace.dependencies.gen_mcf2]
git = "https://gitee.com/lino_snsalias/gen_mcf2.rs.git"

[workspace.dependencies.buffex]
git = "https://gitee.com/lino_snsalias/buffex.git"
branch = "dev/0.3.0"

[workspace.dependencies.mm_ptr]
git = "https://gitee.com/lino_snsalias/mm_ptr.git"
branch = "dev/0.1.3"

# ── 通用工具：至少两个成员在用 ────────────────────────────────────────
# [workspace.dependencies.funty]
# version = "3.0.0-rc2"
# default-features = false

# [workspace.dependencies.pin-project]
# version = "1.1.*"

# [workspace.dependencies.pin-utils]
# version = "*"

[workspace.dependencies.log]
version = "0.4.*"

[workspace.dependencies.futures-lite]
version = "2"

# `fs`   —— kb_core 的本地文件存储
# `net`  —— kb_core_rproxy 的 TCP 监听（缺了它 compio 就没有 `net` 模块）
# `time` —— 计时/超时
# `macros` —— `#[compio::main]` / `#[compio::test]`
[workspace.dependencies.compio]
version = "0.19.*"
features = ["fs", "macros", "net", "time"]

[workspace.dependencies.thiserror]
version = "2.0"
default-features = false

