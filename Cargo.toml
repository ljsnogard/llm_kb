[workspace]
resolver = "3"
members = [
    "kb_svc/crates/abs_kb_svc",
    "kb_svc/crates/abs_llm",
    "kb_svc/crates/kb_core",
    "kb_svc/crates/kb_svc_salvo",

    "kb_plugins/crates/kb_rig_llm_agent",
    "kb_plugins/crates/kb_rig_llm_adapt",
]

[workspace.package]
edition = "2024"
authors = ["lino <lino_snsalias@outlook.com>"]

# 这里只保留「多个成员共用」的依赖。
# 只为单个 crate 服务的依赖写在各自的 Cargo.toml 里（例如 salvo 只属于 kb_svc_salvo）。
[workspace.dependencies]
# ── 知识库自身的抽象层与基础设施 ──────────────────────────────────────
abs_art-bridge = { version = "0.2.2" }
abs_cancel = { git = "https://gitee.com/lino_snsalias/abs_cancel-rs.git" }
abs_str = { git = "https://gitee.com/lino_snsalias/abs_str-rs.git" }
anylr = { git = "https://gitee.com/lino_snsalias/anylr.rs.git", branch = "dev/0.2.0" }
buffex = { git = "https://gitee.com/lino_snsalias/buffex.git", branch = "dev/0.3.0" }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.1.3" }

# ── 通用工具：至少两个成员在用 ────────────────────────────────────────
funty = { version = "3.0.0-rc2", default-features = false }
pin-project = { version = "1.1.*" }
pin-utils = { version = "*" }
log = { version = "0.4.*" }
futures-lite = { version = "2" }
compio = { version = "0.19.*", features = ["fs", "macros", "time"] }
thiserror = { version = "2.0", default-features = false }

# ── 服务端运行时：kb_svc_salvo 与 kb_core 都在用 ──────────────────────
tokio = { version = "1.*", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
] }
