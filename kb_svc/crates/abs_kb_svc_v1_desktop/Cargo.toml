[package]
edition = "2024"
name = "abs_kb_svc_v1_desktop"
version = "0.1.0"

description = "Protocol v1 between the desktop client (kb_admin_desktop) and kb_core."

[dependencies]
# LLM 语义词汇（`Role` / `LogicOutput` / `Capabilities` 等）：协议里直接复用它们，
# 不镜像第二套枚举。`abs_cancel` 也经它的 `x_deps` 转出来（见 `src/rpc_.rs`）。
abs_llm = { path = "../abs_llm" }

# 系统层握手的消息（`IpcReadyNotice` / `HandshakeNoticeKind`）。它们在独立 crate 里
# ——只想启动并找到 `kb_core` 的调用方（`kb_core_starter`）因此不必依赖整套业务协议；
# 本 crate 把它们转出来，让桌面协议的公开面同时包含两个层次。
abs_kb_core_handshake = { path = "../abs_kb_core_handshake" }

# 协议数据类型的跨进程表示。
# 与 `abs_llm` 的临时决策（dev-notes/llm_kb-20260917-1655.md §1.4）一致：只给纯数据 enum/struct 派生，
# 具体线上格式仍由实现 crate（`kb_svc_servo_ipc` 等）决定。
#
# 刻意不开 serde 的 `std`：协议类型本身不需要它。但**必须开 `alloc`**——
# 协议里到处是 `String` / `Vec<T>` / `Option<T>`，没有 `alloc` 这些类型就没有
# `Serialize` / `Deserialize` 实现。
#
# 另一条硬约束：**不能用 serde 的内部标签枚举（`#[serde(tag = ...)]`）**，
# 见 `src/lib.rs` 的说明。
serde = { version = "1.*", default-features = false, features = ["alloc", "derive"] }

# 仅用于生成 kb_core 分配的标识（`<前缀>-<uuid-v4>`）。
uuid = { version = "1.*", features = ["v4", "fast-rng"] }

[dev-dependencies]
# 契约测试要用取消令牌本身（`CancelledToken` / `NonCancellableToken`）以及
# `gen_mcf2` 展开出来的 future 所约束的 `TrMayCancel`，所以它必须能直接命名
# `abs_cancel`——集成测试是独立 crate，看不到 `[dependencies]`。
abs_cancel = { workspace = true }

# `tests/rpc_contract.rs` 用它展开出一个 mock 实现，证明「手写 GAT + 宏生成的
# future」这套形状真的可用。**库本身不依赖它**：`gen_mcf2` 只能作用于模块级
# 自由函数，trait 里用不上。
gen_mcf2 = { workspace = true }

# 集成测试里用 `block_on` 驱动 trait 的 future。
futures-lite = { workspace = true }

# 校验协议类型在「实现候选真正使用的编解码器」上也能往返。
# ipc-channel 0.23 用 postcard，见 dev-notes/abs_kb_svc-20260917-1254.md §3。
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde_json = { version = "1.*" }

