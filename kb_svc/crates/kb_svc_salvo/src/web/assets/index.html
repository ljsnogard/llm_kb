<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>llm_kb</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar__left">
          <span class="brand">
            <span class="brand__dot" aria-hidden="true"></span>
            <span class="brand__name">llm_kb</span>
          </span>
          <span class="badge" id="plugin-badge" title="LLM 插件连接状态">插件离线</span>
        </div>

        <div class="topbar__right">
          <label class="select" title="当前使用的 LLM 服务">
            <span class="select__label">服务</span>
            <select id="service-select" aria-label="当前使用的 LLM 服务"></select>
          </label>

          <button class="icon-btn" id="theme-toggle" type="button" title="切换深浅色" aria-label="切换深浅色">◐</button>
          <button class="icon-btn" id="settings-toggle" type="button" title="设置" aria-label="设置" aria-expanded="false">⚙</button>
        </div>
      </header>

      <main class="chat" id="chat">
        <div class="chat__empty" id="chat-empty">
          <h1 class="chat__empty-title">llm_kb</h1>
          <p class="chat__empty-text">
            个人知识库应用的对话入口。先在右上角 <strong>⚙ 设置</strong> 里填好 LLM 服务的 API key，
            再从下面提问。
          </p>
        </div>
        <div class="messages" id="messages"></div>
      </main>

      <footer class="composer">
        <div class="composer__box">
          <textarea
            id="composer-input"
            class="composer__input"
            rows="1"
            placeholder="输入问题，Enter 发送，Shift+Enter 换行"
            aria-label="问题输入框"
          ></textarea>
          <div class="composer__actions">
            <button class="btn btn--ghost" id="cancel-btn" type="button" hidden>停止</button>
            <button class="btn btn--primary" id="send-btn" type="button">发送</button>
          </div>
        </div>
        <p class="composer__hint" id="composer-hint"></p>
      </footer>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <aside class="panel" id="panel" hidden aria-label="设置">
      <header class="panel__header">
        <h2 class="panel__title">设置</h2>
        <button class="icon-btn" id="panel-close" type="button" aria-label="关闭设置">✕</button>
      </header>

      <section class="panel__section">
        <h3 class="panel__subtitle">LLM 服务</h3>
        <p class="panel__note">
          API key 以<strong>明文</strong>保存在服务端配置文件里（当前阶段的安全取舍），
          请不要把该文件提交到版本库。
        </p>
        <p class="panel__note panel__note--mono" id="config-path"></p>
        <ul class="service-list" id="service-list"></ul>
      </section>

      <section class="panel__section">
        <h3 class="panel__subtitle" id="form-title">新增服务</h3>
        <form class="form" id="service-form" autocomplete="off">
          <label class="field">
            <span class="field__label">服务标识</span>
            <input class="field__input" id="field-id" type="text" placeholder="deepseek" required />
          </label>
          <label class="field">
            <span class="field__label">Provider</span>
            <input class="field__input" id="field-provider" type="text" placeholder="deepseek" required />
          </label>
          <label class="field">
            <span class="field__label">模型</span>
            <input class="field__input" id="field-model" type="text" placeholder="deepseek-chat" required />
          </label>
          <label class="field">
            <span class="field__label">Base URL（可留空）</span>
            <input class="field__input" id="field-base-url" type="text" placeholder="https://api.deepseek.com" />
          </label>
          <label class="field">
            <span class="field__label">API key</span>
            <input class="field__input" id="field-api-key" type="text" placeholder="sk-..." />
          </label>

          <div class="form__actions">
            <button class="btn btn--primary" type="submit">保存</button>
            <button class="btn btn--ghost" id="form-reset" type="button">清空</button>
          </div>
        </form>
      </section>

      <p class="panel__status" id="panel-status" role="status"></p>
    </aside>

    <script src="/app.js" defer></script>
  </body>
</html>
