[package]
edition = "2024"
name = "kb_rig_llm_v1_agent"
version = "0.1.0"

description = "kb LLM plugins to interact with LLM services."

[dependencies]
# 临时决策（dev-notes §2.5）：直接复用 `abs_llm` 带有 serde 派生的语义类型。
abs_llm = { path = "../../../kb_svc/crates/abs_llm" }
anyhow = "1"
chrono = "0.4"
futures = "0.3"
rig = "0.41"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
