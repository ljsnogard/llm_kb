# 客户端自带的 Rust 侧（flutter_rust_bridge 生成的原生库）。
#
# 这里显式声明一个空的 `[workspace]`，让它成为独立的 workspace 根：
# 本目录位于仓库根 `Cargo.toml` 的 workspace 目录树之内，却没有（也不应该）
# 被列为成员——不声明的话 cargo 会报
# 「current package believes it's in a workspace when it's not」，
# 导致 `flutter build linux` 失败。
#
# 客户端与知识库服务端的依赖完全不同（只需要 flutter_rust_bridge），
# 因此独立成根比加进服务端 workspace 更干净。
[workspace]

[package]
name = "rust_lib_kb_admin_desktop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

# 客户端侧的连接逻辑（配置 + 三种连接方式的连接管理器）。
# 这两个 crate 在主 workspace 的 `kb_clients/crates/` 下，用 path 引用即可
# ——跨 workspace 的 path 依赖已实测可用。
kb_client_config = { path = "../../crates/kb_client_config" }
kb_client_conn_mgr = { path = "../../crates/kb_client_conn_mgr" }

# 协议类型：`list_sessions` 要把界面传来的工作区标识包成 `WorkspaceId`。
abs_kb_svc_v1_desktop = { path = "../../../kb_svc/crates/abs_kb_svc_v1_desktop" }

# 会话正文里的说话人是 `abs_llm::v1::cont::Role`（协议直接复用它，不镜像第二套枚举），
# 因此这一层把它翻成字符串时要能命名它。
abs_llm = { path = "../../../kb_svc/crates/abs_llm" }

# 把 `kb_client_conn_mgr` 的异步接口同步化（为什么，见 `src/api/kb.rs` 的模块文档）。
futures-lite = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
